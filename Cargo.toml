[package]
name = "bigseek"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
description = "Bigram full-text search index with CJK support: compact binary format, native builder, WebAssembly runtime"
license = "MIT"
repository = "https://github.com/imba97/bigseek"
readme = "README.md"
keywords = ["search", "wasm", "cjk", "bigram", "index"]
categories = ["wasm", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# 默认带上 cli：让 `cargo build` / `cargo run` / `cargo test` 以及编辑器（rust-analyzer）
# 开箱可用，不必记住 `--features cli`。
#
# ⚠️ 代价：wasm-pack 必须显式 `--no-default-features --features wasm`。
#    忘了加 `--no-default-features` 也不会坏——comrak/serde_yaml_ng/regex 会被编进 wasm，
#    实测只多 5 KiB（LTO 会消掉未被引用的代码），但构建会变慢。
default = ["cli"]
# WebAssembly 运行期绑定（wasm-pack build --no-default-features --features wasm）
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# 构建期 CLI：读 search-full.json 或直接读 posts/ 产出 search.idx。
# markdown 解析（comrak）与 YAML 解析只在这个 feature 里，不该进 wasm 产物。
cli = ["dep:serde", "dep:serde_json", "dep:comrak", "dep:serde_yaml_ng", "dep:regex"]

[dependencies]
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
# 刻意关掉默认特性：default 会带上 cli + syntect（syntect 又拉 onig，C 依赖）
comrak = { version = "0.52", optional = true, default-features = false }
serde_yaml_ng = { version = "0.10", optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasm 侧 ABI 测试（纯 Rust 编写，`wasm-pack test --node` 执行）。
# 用它替代早期的 Node 冒烟脚本：仓库里不再出现 JS。
wasm-bindgen-test = "0.3"

# 本 crate 同时是 cdylib；Windows 上构建测试时会打印 dll.lib 生成信息，属噪声
[lints.rust]
linker_messages = "allow"

[[bin]]
name = "build-index"
path = "src/bin/build-index.rs"
required-features = ["cli"]

[profile.release]
# 体积优先：同一份 profile 同时服务 wasm（下载体积）与 native CLI（构建期一次性任务）
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Rust 1.87+ 默认会发出 bulk-memory / nontrapping-fptoint 指令，
# 而 wasm-pack 自带的 binaryen 默认不开启这两项校验，直接跑 wasm-opt 会 Fatal。
# 显式打开对应 feature（而不是关掉 wasm-opt），体积优化才能生效。
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-mutable-globals",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
