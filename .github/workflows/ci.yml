name: CI

# Tag-only trigger: nothing runs on branch pushes or pull requests.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

  wasm:
    name: Wasm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # wasm-pack test --node needs a Node runtime as the wasm host.
      # Windows + Node 24 crashes at exit (libuv assertion); Linux + Node 22 is unaffected.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test wasm ABI contract
        run: wasm-pack test --node --no-default-features --features wasm

      - name: Build wasm package
        run: wasm-pack build --target web --release --out-dir pkg --no-pack --no-default-features --features wasm

      - name: Build smoke index from JSON
        run: |
          cargo run --release --bin build-index -- \
            --input tests/fixtures/search-full.json \
            --output target/smoke.idx \
            --verify

      - name: Build smoke index from posts
        run: |
          cargo run --release --bin build-index -- \
            --posts-dir tests/fixtures/posts \
            --output target/smoke-posts.idx \
            --verify

      - name: Report artifact sizes
        run: |
          echo "### Wasm artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -l pkg/bigseek_bg.wasm | awk '{printf "- bigseek_bg.wasm: %.1f KiB\n", $5/1024}' >> "$GITHUB_STEP_SUMMARY"
          ls -l pkg/bigseek.js | awk '{printf "- bigseek.js: %.1f KiB\n", $5/1024}' >> "$GITHUB_STEP_SUMMARY"
          ls -l target/smoke.idx target/smoke-posts.idx | awk '{printf "- %s: %d bytes\n", $9, $5}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/
          if-no-files-found: error
