name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 原生侧：格式、lint、单测、分词向量
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（零警告，含 wasm feature）
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 测试
        run: cargo test

  # wasm 侧：产物能编译、ABI 契约成立（测试代码是 Rust，`wasm-pack test --node` 执行）
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # wasm-pack test --node 需要 Node 作为 wasm 宿主。
      # 注意：Windows + Node 24 下 runner 会在测试跑完后崩（libuv 断言），
      # 这里用的是 Linux + Node 22，不受影响。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: wasm ABI 契约测试
        run: wasm-pack test --node --no-default-features --features wasm

      - name: 编译 wasm
        run: wasm-pack build --target web --release --out-dir pkg --no-pack --no-default-features --features wasm

      - name: 生成冒烟索引（JSON 输入）
        run: |
          cargo run --release --bin build-index -- \
            --input tests/fixtures/search-full.json \
            --output target/smoke.idx \
            --verify

      - name: 直读 fixture 文章（--posts-dir）
        run: |
          cargo run --release --bin build-index -- \
            --posts-dir tests/fixtures/posts \
            --output target/smoke-posts.idx \
            --verify

      - name: 体积报告
        run: |
          echo "### wasm 体积" >> "$GITHUB_STEP_SUMMARY"
          ls -l pkg/bigseek_bg.wasm | awk '{printf "- bigseek_bg.wasm: %.1f KiB\n", $5/1024}' >> "$GITHUB_STEP_SUMMARY"
          ls -l pkg/bigseek.js | awk '{printf "- bigseek.js: %.1f KiB\n", $5/1024}' >> "$GITHUB_STEP_SUMMARY"
          ls -l target/smoke.idx target/smoke-posts.idx | awk '{printf "- %s: %d bytes\n", $9, $5}' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/
          if-no-files-found: error
